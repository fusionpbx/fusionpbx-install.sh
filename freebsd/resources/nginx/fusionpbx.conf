
server {
	listen  127.0.0.1:80;
	server_name  127.0.0.1;

	#set the log files
	error_log /var/log/nginx/error.log info;
	access_log /var/log/nginx/access.log;

	#set the default index files
	location / {
		root   /usr/local/www/fusionpbx;
		index  index.php index.html index.htm;
	}

	#nginx settings
	client_max_body_size 128M;
	client_body_buffer_size 128k;

	#http error handling
	error_page   500 502 503 504  /50x.html;
	location = /50x.html {
		root   /usr/local/www/nginx-dist;
	}

	#pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
	location ~ \.php$ {
		fastcgi_pass   127.0.0.1:9000;
		fastcgi_index  index.php;
		fastcgi_param  SCRIPT_FILENAME  /usr/local/www/fusionpbx$fastcgi_script_name;
		include        fastcgi_params;
	}

	#disable viewing of .htaccess, htpassword, .db and .git
	location ~ /\.htaccess {
		deny  all;
	}
	location ~ .htpassword {
		deny all;
	}
	location ~^.+.(db)$ {
		deny all;
	}
	location ~ /\.git {
		deny all;
	}
	location ~ /\. {
		deny all;
	}
}

server {
	listen  80;
	server_name  fusionpbx;

	#set the log files
	error_log /var/log/nginx/error.log info;
	access_log /var/log/nginx/access.log;

	#redirect letsencrypt to dehydrated
	location ^~ /.well-known/acme-challenge {
		default_type "text/plain";
		auth_basic "off";
		alias /usr/local/www/dehydrated;
	}

	#set the default index files
	location / {
		root   /usr/local/www/fusionpbx;
		index  index.php index.html index.htm;
	}

	#rewrite rule - send to https with an exception for provisioning
	if ($uri !~* ^.*(provision|xml_cdr).*$) {
		rewrite ^(.*) https://$host$1 permanent;
		break;
	}

	#rewrite rule - REST api
	if ($uri ~* ^.*/api/.*$) {
		rewrite ^(.*)/api/(.*)$ $1/api/index.php?rewrite_uri=$2 last;
		break;
	}

	#single point of entry
	location / {
		root /var/www/fusionpbx/public;
		index index.php;
		try_files $uri $uri/ /public/index.php?$query_string;
	}

	#nginx settings
	client_max_body_size 128M;
	client_body_buffer_size 128k;

	#http error handling
	error_page   500 502 503 504  /50x.html;
	location = /50x.html {
		root   /usr/local/www/nginx-dist;
	}
	
	#pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
	location ~ \.php$ {
		fastcgi_pass   127.0.0.1:9000;
		fastcgi_index  index.php;
		fastcgi_param  SCRIPT_FILENAME  /usr/local/www/fusionpbx$fastcgi_script_name;
		include        fastcgi_params;
	}

	#disable viewing of .htaccess, htpassword, .db, and .git
	location ~ /\.htaccess {
		deny  all;
	}
	location ~ .htpassword {
		deny all;
	}
	location ~^.+.(db)$ {
		deny all;
	}
	location ~ /\.git {
		deny all;
	}
	location ~ /\. {
		deny all;
	}
}

server {
	listen  443 ssl;
	server_name  fusionpbx;

	#set tls configuration
	ssl_certificate         /usr/local/etc/nginx/server.crt;
	ssl_certificate_key     /usr/local/etc/nginx/server.key;
